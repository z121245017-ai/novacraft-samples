<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600">
  <rect width="840" height="600" fill="#ffffff"/>
  <text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">
    QA Overlay — 2D Plan Spec (Dashed) vs Exported .glb Geometry (Shaded)
  </text>
  <text x="40" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4b5563">
    Recomputed directly from floorplan_1f_synthetic.glb binary vertex buffers | Tolerance: ±0.010 m (±10 mm)
  </text>

  <!-- 2D Plan reference outlines (dashed) -->
  <rect x="100.0" y="110.0" width="600.0" height="400.0" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="120.0" y="302.5" width="229.99999999999997" height="15.0" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="440.0" y="302.5" width="240.0" height="15.0" fill="none" stroke="#111827" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Actual GLB wall footprints -->
  <rect x="100.0" y="110.0" width="600.0" height="20.0" fill="#0f766e" fill-opacity="0.38" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="100.0" y="490.0" width="600.0" height="20.0" fill="#0f766e" fill-opacity="0.38" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="100.0" y="130.0" width="20.0" height="360.0" fill="#0f766e" fill-opacity="0.38" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="680.0" y="130.0" width="20.0" height="360.0" fill="#0f766e" fill-opacity="0.38" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="120.0" y="302.5" width="234.0" height="15.0" fill="#2563eb" fill-opacity="0.38" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="436.0" y="302.5" width="244.0" height="15.0" fill="#2563eb" fill-opacity="0.38" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Highlight the two 40 mm encroaching jamb regions in red -->
  <rect x="350.0" y="302.5" width="4.0" height="15.0" fill="#dc2626" fill-opacity="0.85"/>
  <rect x="436.0" y="302.5" width="4.0" height="15.0" fill="#dc2626" fill-opacity="0.85"/>

  <!-- Callout 1: Wall_North PASS -->
  <rect x="250.0" y="68.0" width="300" height="28" rx="5" fill="#ecfdf5" stroke="#10b981"/>
  <text x="400.0" y="87.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#065f46">
    CHECK 1 PASS: Wall_North = 6.000 m (Δ 0.000 m)
  </text>

  <!-- Callout 2: Doorway D1 FAIL -->
  <line x1="354.0" y1="321.5" x2="354.0" y2="371.5" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="436.0" y1="321.5" x2="436.0" y2="371.5" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="215.0" y="373.5" width="370" height="46" rx="5" fill="#fef2f2" stroke="#dc2626"/>
  <text x="400.0" y="392.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#991b1b">
    CHECK 2 FAIL: Doorway D1 = 0.820 m vs 0.900 m spec
  </text>
  <text x="400.0" y="410.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#7f1d1d">
    Δ = -0.080 m (-80 mm): +40 mm east on West wall, -40 mm west on East wall
  </text>

  <!-- Callout 3: Unverifiable item -->
  <rect x="100.0" y="534.0" width="600" height="44" rx="5" fill="#fffbeb" stroke="#d97706"/>
  <text x="115.0" y="553.0" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#92400e">
    CHECK 3 UNVERIFIABLE_FROM_2D_PLAN: Wall height 2.800 m &amp; D1 lintel soffit 2.100 m
  </text>
  <text x="115.0" y="570.0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78350f">
    Omitted from 2D plan — classified as source ambiguity (needs section/elevation spec, NOT filed as model bug).
  </text>
</svg>

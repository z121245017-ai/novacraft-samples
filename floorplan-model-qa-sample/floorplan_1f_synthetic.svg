<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="840" height="620" fill="#ffffff"/>
  <text x="40" y="36" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#111827">
    2D Source Floorplan — Level 1F (Self-Created Synthetic QA Demo)
  </text>
  <text x="40" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#4b5563">
    Units: meters (100 px = 1.000 m) | Exterior wall thickness: 0.200 m | Interior partition thickness: 0.150 m | NO vertical elevation/ceiling notes on plan
  </text>

  <!-- Rooms background -->
  <rect x="120.0" y="130.0" width="560.0" height="172.5" fill="#f8fafc" stroke="none"/>
  <rect x="120.0" y="317.5" width="560.0" height="172.5" fill="#f1f5f9" stroke="none"/>

  <!-- Exterior Walls (plan spec) -->
  <rect x="100.0" y="110.0" width="600.0" height="20.0" fill="#334155"/>
  <rect x="100.0" y="490.0" width="600.0" height="20.0" fill="#334155"/>
  <rect x="100.0" y="130.0" width="20.0" height="360.0" fill="#334155"/>
  <rect x="680.0" y="130.0" width="20.0" height="360.0" fill="#334155"/>

  <!-- Interior Partition Wall with Doorway D1 clear opening [2.500, 3.400] = 0.900 m -->
  <rect x="120.0" y="302.5" width="229.99999999999997" height="15.0" fill="#475569"/>
  <rect x="440.0" y="302.5" width="240.0" height="15.0" fill="#475569"/>

  <!-- Doorway D1 architectural swing symbol (0.900 m clear opening) -->
  <line x1="350.0" y1="317.5" x2="350.0" y2="407.5" stroke="#1d4ed8" stroke-width="2"/>
  <path d="M 350.0 407.5 A 90.0 90.0 0 0 0 440.0 317.5" fill="none" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Room labels -->
  <text x="400.0" y="225.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a">LIVING / WORK ROOM</text>
  <text x="400.0" y="246.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">Interior clear: 5.600 m × 1.725 m</text>
  <text x="400.0" y="425.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0f172a">STUDY ROOM</text>
  <text x="400.0" y="446.0" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#475569">Interior clear: 5.600 m × 1.725 m</text>

  <!-- Dimension 1: Exterior North Wall = 6.000 m -->
  <line x1="100.0" y1="82.0" x2="100.0" y2="106.0" stroke="#64748b" stroke-width="1"/>
  <line x1="700.0" y1="82.0" x2="700.0" y2="106.0" stroke="#64748b" stroke-width="1"/>
  <line x1="104.0" y1="92.0" x2="696.0" y2="92.0" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="326.0" y="80.0" width="148" height="22" fill="#ffffff"/>
  <text x="400.0" y="96.0" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#111827">Wall_North = 6.000 m</text>

  <!-- Dimension East Exterior = 4.000 m -->
  <line x1="704.0" y1="110.0" x2="734.0" y2="110.0" stroke="#64748b" stroke-width="1"/>
  <line x1="704.0" y1="510.0" x2="734.0" y2="510.0" stroke="#64748b" stroke-width="1"/>
  <line x1="724.0" y1="114.0" x2="724.0" y2="506.0" stroke="#1f2937" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="740.0" y="314.0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#111827">4.000 m</text>

  <!-- Dimension 2: Doorway D1 Clear Opening = 0.900 m -->
  <line x1="350.0" y1="268.5" x2="350.0" y2="300.5" stroke="#1d4ed8" stroke-width="1"/>
  <line x1="440.0" y1="268.5" x2="440.0" y2="300.5" stroke="#1d4ed8" stroke-width="1"/>
  <line x1="354.0" y1="282.5" x2="436.0" y2="282.5" stroke="#1d4ed8" stroke-width="1.8" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <rect x="309.0" y="250.5" width="172" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="395.0" y="265.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#1e40af">Doorway D1 Clear = 0.900 m</text>

  <!-- Scale bar & North arrow & Ambiguity note -->
  <g transform="translate(100, 545)">
    <rect x="0" y="0" width="100" height="8" fill="#111827"/>
    <rect x="100" y="0" width="100" height="8" fill="#ffffff" stroke="#111827"/>
    <text x="0" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#111827">0 m</text>
    <text x="94" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#111827">1 m</text>
    <text x="194" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#111827">2 m</text>
  </g>
  <g transform="translate(760, 120)">
    <polygon points="0,-24 8,6 0,0 -8,6" fill="#111827"/>
    <text x="0" y="-30" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="12" font-weight="700" fill="#111827">N</text>
  </g>
  <rect x="330" y="538" width="465" height="52" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="344" y="558" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e">
    Source Ambiguity Notice (Intentional QA Test Case):
  </text>
  <text x="344" y="576" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#78350f">
    2D plan contains X-Y dimensions only. Ceiling height &amp; door lintel height are NOT specified.
  </text>
</svg>

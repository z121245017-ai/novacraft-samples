<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Night Post • A sorting puzzle</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#182c30;background:#f2e8ce;font-family:"Avenir Next",Avenir,Arial,sans-serif}main{width:min(850px,100%);margin:auto;padding:clamp(16px,4vw,44px)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #254648;padding-bottom:12px}h1{font:700 clamp(38px,8vw,76px)/.93 Georgia,serif;letter-spacing:-.065em;margin:0}header span,.label{font:700 12px/1.35 ui-monospace,monospace;letter-spacing:.10em;text-transform:uppercase}h2{font:600 clamp(22px,4vw,32px)/1.1 Georgia,serif;margin:7px 0 5px}.how{font-size:15px;line-height:1.5;margin:8px 0 0;max-width:64ch}.intro{margin:22px 0 20px}.layout{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(140px,.8fr);gap:clamp(14px,4vw,42px);align-items:start}.panel{padding:clamp(12px,2.6vw,22px);background:#fff8e7;border:1px solid #7e8375;border-radius:5px}.panel h3,.ticket h3{margin:0 0 12px;font-size:13px;letter-spacing:.09em;text-transform:uppercase}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 44px;gap:5px}.tile{width:100%;aspect-ratio:1;display:grid;place-items:center;font:700 clamp(24px,5vw,48px)/1 Georgia,serif;border-radius:3px;border:1px solid #15292b44}.tile[data-ink="A"]{background:#1d5053;color:#fff7df}.tile[data-ink="B"]{background:#a33c2c;color:#fff7df}.tile[data-ink="C"]{background:#e0b44e;color:#3a2f17}.tile[data-ink="D"]{background:#595578;color:#fff7df}.tile[data-ink="E"]{background:#fbf4e2;color:#213536}.ticket{border-top:4px double #65726a;border-bottom:2px solid #65726a;padding:12px 0}.target{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;max-width:158px}.target .tile{font-size:clamp(18px,3.2vw,30px)}button{background:#eae0c6;color:#173237;border:1px solid #53665f;border-radius:4px;min-height:42px;padding:4px 13px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #0751ad;outline-offset:2px}button:disabled{opacity:.49;cursor:default}button:hover:enabled{background:#dacfad}.rotate{font-size:23px;padding:0;background:#e2d9ba}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{font-size:14px}.actions .next{background:#245252;color:white}.status{font-weight:600;font-size:15px;line-height:1.5;margin:16px 0 5px}.count{font:14px ui-monospace,monospace}.done{color:#22553c}button[hidden]{display:none} @media(max-width:580px){main{width:min(475px,100%)}.layout{grid-template-columns:minmax(0,1fr) minmax(76px,.39fr);gap:10px}.panel{padding:9px}.board{grid-template-columns:repeat(3,minmax(0,1fr)) 32px;gap:3px}.rotate{min-height:35px}.ticket h3,.panel h3{font-size:10px;letter-spacing:.035em}.target .tile{font-size:17px}.status{font-size:14px}header span{font-size:10px;letter-spacing:.05em}.how{font-size:14px}.intro{margin:17px 0 14px}}@media(max-width:350px){.layout{grid-template-columns:minmax(0,1fr)}.target{max-width:100px}.ticket{width:100%}.rotate{min-height:40px}}
</style>
<main><header><h1>Night Post</h1><span>Mail sorting puzzle</span></header><section class="intro"><span class="label" id="stage"></span><h2 id="title"></h2><p class="how">Match the tray to the dispatch card. Tap a row arrow to shift its stamps left, or a column arrow to shift them down. Stamps wrap around.</p></section>
<div class="layout"><section class="panel"><h3>Sorting tray</h3><div class="board" id="board"></div></section><section class="ticket"><h3>Dispatch card</h3><div class="target" id="target" aria-label="Target pattern"></div></section></div>
<p class="status" id="status" role="status" aria-live="polite"></p><div class="count" id="counter"></div><div class="actions"><button type="button" id="undo">Undo</button><button type="button" id="reset">Reset tray</button><button type="button" id="next" class="next" hidden>Next dispatch</button></div></main>
<script>
'use strict';
const levels=[{"title":"Opening the counter","target":"AABBCCABC","start":"AACBCCABB","par":1},{"title":"Sorting postcards","target":"ABACBCBAC","start":"ACBBBCAAC","par":2},{"title":"The red dispatch","target":"AABCBCACB","start":"ABCCABBAC","par":3},{"title":"A letter from the coast","target":"ABCCDAABD","start":"AABCADCBD","par":4},{"title":"A missed connection","target":"ABCDABCDA","start":"CDBCADAAB","par":4},{"title":"The last ferry","target":"ADCBADBAC","start":"CBADCAABD","par":5},{"title":"Before the lamps go out","target":"ABCDBACDA","start":"ADBDAABCC","par":6},{"title":"First light","target":"ABCDEBCDA","start":"ABEDCBDCA","par":7}];
const symbols={A:['●','circle'],B:['▲','triangle'],C:['■','square'],D:['✦','star'],E:['◆','diamond']};
const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8]];
const byId=id=>document.getElementById(id);
let index=0, tray='', history=[];
const liveTiles=[],cardTiles=[],arrows=[];
function drawStamp(cell,ink,position){const [shape,name]=symbols[ink];cell.dataset.ink=ink;cell.textContent=shape;cell.setAttribute('role','img');cell.setAttribute('aria-label','Row '+(Math.floor(position/3)+1)+', column '+(position%3+1)+', '+name);}
function addTile(parent,arr){const cell=document.createElement('span');cell.className='tile';parent.append(cell);arr.push(cell);}
function addArrow(number){const btn=document.createElement('button');const row=number<3;btn.type='button';btn.className='rotate';btn.dataset.action=number;btn.textContent=row?'←':'↓';btn.setAttribute('aria-label',(row?'Move row ':'Move column ')+(number%3+1)+(row?' left':' down'));btn.addEventListener('click',()=>move(number));byId('board').append(btn);arrows.push(btn);}
for(let row=0;row<3;row++){for(let col=0;col<3;col++)addTile(byId('board'),liveTiles);addArrow(row);}
for(let col=0;col<3;col++)addArrow(col+3);
for(let i=0;i<9;i++)addTile(byId('target'),cardTiles);
function show(){const lvl=levels[index],solved=tray===lvl.target;for(let i=0;i<9;i++){drawStamp(liveTiles[i],tray[i],i);drawStamp(cardTiles[i],lvl.target[i],i);}
 byId('stage').textContent='Dispatch '+String(index+1).padStart(2,'0')+' / '+String(levels.length).padStart(2,'0');byId('title').textContent=lvl.title;
 const matches=[...tray].filter((v,i)=>v===lvl.target[i]).length;
 byId('status').textContent=solved?(index===levels.length-1?'Shift complete. The morning post is ready.':'Dispatch sorted. The next tray is ready.'):(matches+' of 9 stamps in position.');byId('status').classList.toggle('done',solved);
 byId('counter').textContent='Moves '+history.length+'  ·  Shortest '+lvl.par;
 byId('undo').disabled=!history.length;byId('reset').disabled=!history.length;byId('next').hidden=!solved;byId('next').textContent=index===levels.length-1?'Start another shift':'Next dispatch';arrows.forEach(b=>b.disabled=solved);
}
function loadLevel(n){index=n;tray=levels[n].start;history=[];show();}
function move(number){if(tray===levels[index].target)return;const cells=lines[number],output=tray.split('');history.push(tray);const step=number<3?2:1;cells.forEach((from,i)=>output[cells[(i+step)%3]]=tray[from]);tray=output.join('');show();if(tray===levels[index].target)byId('next').focus();}
byId('undo').addEventListener('click',()=>{if(history.length)tray=history.pop();show();});byId('reset').addEventListener('click',()=>loadLevel(index));byId('next').addEventListener('click',()=>{loadLevel((index+1)%levels.length);arrows[0].focus();});loadLevel(0);
</script></html>
